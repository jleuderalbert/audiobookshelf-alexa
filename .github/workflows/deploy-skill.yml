name: Deploy Alexa skill

# Deploys skill-package/ (manifest + interaction models) to the skill's
# development stage whenever it changes on main, using the shared
# jleuderalbert/alexa-skill-deploy action. Setup (refresh token, repository
# variables): see "Automatic deployment with GitHub Actions" in
# docs/installation.md.

on:
  push:
    branches: [main]
    paths:
      - 'skill-package/**'
      - '.github/workflows/deploy-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-skill
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the repository variable ALEXA_SKILL_ID is set.
    if: vars.ALEXA_SKILL_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The endpoint is the repository variable SKILL_ENDPOINT if set (an
      # https:// URL of a self-hosted server.js), otherwise the Lambda the
      # other workflow deploys to: account from the deploy role ARN, plus
      # region and function name.
      - name: Skill endpoint
        id: endpoint
        env:
          SKILL_ENDPOINT: ${{ vars.SKILL_ENDPOINT }}
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'audiobookshelf-alexa' }}
        run: |
          if [ -n "$SKILL_ENDPOINT" ]; then
            echo "uri=$SKILL_ENDPOINT" >> "$GITHUB_OUTPUT"
          else
            echo "uri=arn:aws:lambda:${REGION}:$(cut -d: -f5 <<< "$ROLE_ARN"):function:${FUNCTION_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # An https endpoint behind a wildcard certificate (e.g. Cloudflare's
      # *.example.com edge certificate) must be registered as "Wildcard",
      # otherwise Alexa rejects the certificate. Set the repository variable
      # SKILL_SSL_CERTIFICATE_TYPE to override the type in skill.json (only
      # used together with SKILL_ENDPOINT; a Lambda ARN has no certificate).
      - name: Certificate type
        if: vars.SKILL_ENDPOINT != '' && vars.SKILL_SSL_CERTIFICATE_TYPE != ''
        env:
          CERT_TYPE: ${{ vars.SKILL_SSL_CERTIFICATE_TYPE }}
        run: |
          jq --arg t "$CERT_TYPE" '.manifest.apis.custom.endpoint.sslCertificateType = $t' \
            skill-package/skill.json > skill.json.tmp
          mv skill.json.tmp skill-package/skill.json

      - uses: jleuderalbert/alexa-skill-deploy@v1
        with:
          skill-id: ${{ vars.ALEXA_SKILL_ID }}
          vendor-id: ${{ vars.ASK_VENDOR_ID }}
          ask-refresh-token: ${{ secrets.ASK_REFRESH_TOKEN }}
          endpoint: ${{ steps.endpoint.outputs.uri }}
          locales: ${{ vars.ALEXA_LOCALES }}
