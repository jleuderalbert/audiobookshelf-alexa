name: Deploy Alexa skill

# Deploys skill-package/ (manifest + interaction models) to the skill's
# development stage whenever it changes on main, using the shared
# jleuderalbert/alexa-skill-deploy action. Setup (refresh token, repository
# variables): see "Automatic deployment with GitHub Actions" in
# docs/installation.md.

on:
  push:
    branches: [main]
    paths:
      - 'skill-package/**'
      - '.github/workflows/deploy-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-skill
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the repository variable ALEXA_SKILL_ID is set.
    if: vars.ALEXA_SKILL_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The endpoint is the Lambda the other workflow deploys to: account from
      # the deploy role ARN, plus region and function name.
      - name: Lambda endpoint
        id: endpoint
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'audiobookshelf-alexa' }}
        run: |
          echo "arn=arn:aws:lambda:${REGION}:$(cut -d: -f5 <<< "$ROLE_ARN"):function:${FUNCTION_NAME}" >> "$GITHUB_OUTPUT"

      - uses: jleuderalbert/alexa-skill-deploy@v1
        with:
          skill-id: ${{ vars.ALEXA_SKILL_ID }}
          vendor-id: ${{ vars.ASK_VENDOR_ID }}
          ask-refresh-token: ${{ secrets.ASK_REFRESH_TOKEN }}
          endpoint: ${{ steps.endpoint.outputs.arn }}
          locales: ${{ vars.ALEXA_LOCALES }}
